name: Build TizenBrew Installer and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'repos.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'repos.md'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version/tag name (e.g. v1.1.35)'
        required: false
      publish_release:
        description: 'Publish a GitHub Release'
        required: false
        default: false
        type: boolean

# reisxd/tizen.js has no tags or releases; pin a commit so builds are
# reproducible. Keep in sync with client/services/tizenbrew-installer-service/package.json.
env:
  TIZENJS_REF: 45b00106149d0c8eff74ead4a979c909dd80efd6

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repo with full history and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fail before the version bump/tag if signing can't work.
      - name: Check required secrets
        env:
          TIZEN_AUTHOR_KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          TIZEN_AUTHOR_KEY_PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
          TIZEN_CERT_BUNDLE: ${{ secrets.TIZEN_CERT_BUNDLE }}
        run: |
          missing=0
          for name in TIZEN_AUTHOR_KEY TIZEN_AUTHOR_KEY_PW TIZEN_CERT_BUNDLE; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is not set. See README > Secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::TIZEN_CERT_BUNDLE replaces the certificate-generator download from download.tizen.org, which returns 404. Without it the .wgt cannot be signed."
            exit 1
          fi

      - name: Fetch tags (safety)
        run: |
          git fetch --tags --force --prune

      # ── Bump version + push tag on branch push ───────────────────────────
      - name: Bump version and push tag
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          CURRENT=$(grep '<widget' client/config.xml | grep -oP '(?<=version=")[^"]+')
          echo "Current version: $CURRENT"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          CANDIDATE_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${CANDIDATE_PATCH}"
          while git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null; do
            CANDIDATE_PATCH=$((CANDIDATE_PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${CANDIDATE_PATCH}"
          done

          echo "New version: $NEW_VERSION"
          echo "RELEASE_VERSION=v${NEW_VERSION}" >> $GITHUB_ENV

          sed -i "/<widget/s/version=\"${CURRENT}\"/version=\"${NEW_VERSION}\"/" client/config.xml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add client/config.xml
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push origin HEAD:main

          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      # ── On tag push, derive version from the tag ─────────────────────────
      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      # ── On manual dispatch ───────────────────────────────────────────────
      - name: Set version from manual input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          else
            CURRENT=$(grep '<widget' client/config.xml | grep -oP '(?<=version=")[^"]+')
            RELEASE_VERSION="v${CURRENT}"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Determine release tag
        if: env.RELEASE_VERSION == ''
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            if [ -f client/config.xml ]; then
              CFG_VER=$(sed -n 's/.*version="\([^"]*\)".*/\1/p' client/config.xml | head -n1)
              TAG=${CFG_VER:+v$CFG_VER}
              TAG=${TAG:-v0.0.0-${GITHUB_SHA:0:7}}
            else
              TAG=v0.0.0-${GITHUB_SHA:0:7}
            fi
          fi
          echo "RELEASE_VERSION=$TAG" >> $GITHUB_ENV

      - name: Determine source branch for release notes
        run: |
          BRANCH=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin --contains "$GITHUB_SHA" | sed 's#^origin/##' | grep -v -e '^HEAD$' -e '^origin$' | head -n1)
          if [ -z "$BRANCH" ]; then
            BRANCH="unknown (tag build)"
          fi
          echo "SOURCE_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Determine app metadata for release notes
        run: |
          APP_ID=$(sed -n 's/.*<tizen:application[^>]*id="\([^"]*\)".*/\1/p' client/config.xml | head -n1)
          APP_NAME=$(echo "$APP_ID" | sed -n 's/^[^.]*\.\(.*\)$/\1/p')
          if [ -z "$APP_ID" ]; then APP_ID="unknown"; fi
          if [ -z "$APP_NAME" ]; then APP_NAME="unknown"; fi
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
      
      - name: Install ldid (required system tool)
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7

      - name: Install modules, transpile service and build service
        working-directory: client/services/tizenbrew-installer-service
        run: |
          sudo apt update
          sudo apt install -y expect zip coreutils
          npm install
          npm install -g @vercel/ncc wgt-to-usb "https://github.com/reisxd/tizen.js/tarball/${TIZENJS_REF}" @yao-pkg/pkg
          npm run build
          rm -rf node_modules
          rm -rf transpiled

      - name: Build UI
        working-directory: client/ui
        run: |
          npm install --force
          npm run build
          rm -rf node_modules

      - name: Prepare Tizen Certificate
        run: |
          echo "${{ secrets.TIZEN_AUTHOR_KEY }}" | base64 -d > "${GITHUB_WORKSPACE}/tizenbrew-author.p12"

      # download.tizen.org no longer serves the certificate-generator zip that
      # tizenjs fetches (404). tizenjs skips that download when this folder
      # exists, so restore the same files from a private repo secret instead.
      - name: Restore Tizen certificate-generator files
        env:
          TIZEN_CERT_BUNDLE: ${{ secrets.TIZEN_CERT_BUNDLE }}
        run: |
          CERT_DIR="$HOME/share/.tizen-cert"
          SIGNER="$CERT_DIR/distributor/sdk-public/tizen-distributor-signer.p12"
          mkdir -p "$CERT_DIR"
          if ! echo "$TIZEN_CERT_BUNDLE" | base64 -d | tar -xz -C "$CERT_DIR"; then
            echo "::error title=Bad TIZEN_CERT_BUNDLE::Could not decode/extract the secret. It must be a base64 tar.gz, see README > Creating TIZEN_CERT_BUNDLE."
            exit 1
          fi
          if [ ! -s "$SIGNER" ]; then
            echo "::error title=Bad TIZEN_CERT_BUNDLE::distributor/sdk-public/tizen-distributor-signer.p12 is missing from the bundle. Contents:"
            find "$CERT_DIR" -type f | sed "s#^$CERT_DIR/##"
            exit 1
          fi

      - name: Build TizenBrew
        working-directory: client
        run: |
          mkdir release
          tizenjs build . -t wgt -o release/TizenBrewInstaller.wgt --author "${GITHUB_WORKSPACE}/tizenbrew-author.p12" --authorPwd '${{ secrets.TIZEN_AUTHOR_KEY_PW }}' -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Upload TizenBrew package artifact for Old Tizen
        uses: actions/upload-artifact@v6
        with:
          name: app-${{ github.sha }}-old.wgt
          path: client/release/TizenBrewInstaller.wgt

      - name: Release TizenBrew Build Results
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from branch: `${{ env.SOURCE_BRANCH }}`
            Commit: `${{ github.sha }}`
            TBI_METADATA: {"appId":"${{ env.APP_ID }}","appName":"${{ env.APP_NAME }}"}
          files: |
            client/release/*

      - name: Build Installer Desktop
        working-directory: client
        run: |
          pkg -C GZip . --no-bytecode --public

      - name: Release Installer Desktop
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from branch: `${{ env.SOURCE_BRANCH }}`
            Commit: `${{ github.sha }}`
            TBI_METADATA: {"appId":"${{ env.APP_ID }}","appName":"${{ env.APP_NAME }}"}
          files: |
            client/dist/*
